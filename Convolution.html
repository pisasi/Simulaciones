<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visualizador de convolución</title>
<style>
:root {
    --bg: #f4efe5;
    --panel: #fffaf2;
    --panel-border: #d2c3a8;
    --ink: #2d2418;
    --muted: #746551;
    --accent: #b85c38;
    --accent-soft: #f0c7a9;
    --grid: rgba(88, 67, 45, 0.08);
    --good: #1d8f52;
    --good-soft: #d9f0df;
    --bad: #b03b31;
    --kernel-soft: #f6dfb8;
    --kernel-ink: #7a4d16;
    --input-soft: #dce7f6;
    --input-ink: #2d5376;
    --pool-soft: #eadcf2;
    --pool-ink: #704b86;
    --pad-soft: #eee6d7;
    --pad-ink: #8b7a67;
    --overlap-soft: #f7d7bd;
    --shadow: 0 16px 40px rgba(72, 52, 31, 0.14);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background:
        radial-gradient(circle at top left, #fff8e8 0%, transparent 28%),
        radial-gradient(circle at bottom right, #ecd8bf 0%, transparent 32%),
        linear-gradient(135deg, #efe4d2, var(--bg));
    min-height: 100vh;
}

button,
input,
select {
    font: inherit;
}

.app {
    display: grid;
    grid-template-columns: 360px 1fr;
    min-height: 100vh;
}

.sidebar {
    padding: 24px;
    background: linear-gradient(180deg, rgba(255, 250, 242, 0.96), rgba(244, 235, 218, 0.96));
    border-right: 1px solid var(--panel-border);
    box-shadow: var(--shadow);
    position: relative;
    z-index: 2;
}

.sidebar h1 {
    margin: 0 0 8px;
    font-size: 1.7rem;
    letter-spacing: 0.02em;
}

.sidebar p {
    margin: 0 0 20px;
    color: var(--muted);
    line-height: 1.4;
}

.card {
    background: var(--panel);
    border: 1px solid rgba(126, 101, 71, 0.2);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(111, 84, 52, 0.08);
}

.card h2 {
    margin: 0 0 14px;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
}

#controls {
    display: grid;
    gap: 12px;
}

.field {
    display: grid;
    gap: 6px;
}

.field label {
    font-size: 0.92rem;
    font-weight: 600;
}

.dimension-inputs {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
}

.dimension-separator {
    color: var(--muted);
    font-weight: 700;
}

input[type="number"],
select {
    width: 100%;
    border: 1px solid #cbb89a;
    border-radius: 12px;
    padding: 10px 12px;
    background: #fffdf8;
    color: var(--ink);
}

button {
    border: 0;
    border-radius: 14px;
    padding: 12px 14px;
    cursor: pointer;
    font-weight: 700;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
}

button:hover {
    transform: translateY(-1px);
}

button.primary {
    background: linear-gradient(135deg, #b85c38, #cf7a48);
    color: #fff;
    box-shadow: 0 10px 18px rgba(184, 92, 56, 0.25);
}

button.secondary {
    background: linear-gradient(135deg, #6d8b74, #4d6a56);
    color: #fff;
    box-shadow: 0 10px 18px rgba(77, 106, 86, 0.22);
}

button.ghost {
    background: #efe4d5;
    color: #4d3b28;
    box-shadow: 0 10px 18px rgba(110, 87, 59, 0.12);
}

.main {
    position: relative;
    padding: 20px;
    overflow: auto;
    background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px;
}

.canvas-shell {
    min-height: calc(100vh - 40px);
    border-radius: 24px;
    overflow: auto;
    background: rgba(255, 252, 245, 0.78);
    border: 1px solid rgba(112, 88, 62, 0.18);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), var(--shadow);
    padding: 24px;
}

#vis {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    min-height: 100%;
}

#grids {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    width: 100%;
}

.cell {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(98, 76, 52, 0.32);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.92rem;
    background: #fffdf8;
    box-sizing: border-box;
}

.input-cell {
    background: var(--input-soft);
    color: var(--input-ink);
}

.pad-cell {
    background: var(--pad-soft);
    color: var(--pad-ink);
}

.overlap-cell {
    background: var(--overlap-soft);
    color: var(--ink);
}

.output-cell {
    background: var(--good-soft);
    color: var(--good);
}

.pool-cell {
    background: var(--pool-soft);
    color: var(--pool-ink);
}

span.inp {
    color: var(--input-ink);
}

span.ker {
    color: var(--bad);
}

#kernel-overlay {
    position: absolute;
    border: 2px solid var(--accent);
    border-radius: 10px;
    box-shadow: 0 0 0 2px rgba(240, 199, 169, 0.7);
    pointer-events: none;
}

.kernel-cell {
    background: var(--kernel-soft);
    color: var(--kernel-ink);
}

.grid-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
    border-radius: 22px;
    background: rgba(255, 250, 242, 0.92);
    border: 1px solid rgba(126, 101, 71, 0.16);
    box-shadow: 0 10px 24px rgba(111, 84, 52, 0.1);
}

.grid-label {
    font-size: 1.02rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 8px 14px;
    border-radius: 999px;
    margin-bottom: 12px;
}

.label-kernel {
    background: var(--kernel-soft);
    color: var(--kernel-ink);
}

.label-input {
    background: var(--input-soft);
    color: var(--input-ink);
}

.label-output {
    background: var(--good-soft);
    color: var(--good);
}

.label-pool {
    background: var(--pool-soft);
    color: var(--pool-ink);
}

.nav-buttons {
    width: min(420px, 100%);
    display: grid;
    gap: 10px;
}

.button-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.button-row.single {
    grid-template-columns: 1fr;
}

.footer-note {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.45;
}

@media (max-width: 1000px) {
    .app {
        grid-template-columns: 1fr;
    }

    .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--panel-border);
    }

    .canvas-shell {
        min-height: 72vh;
    }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>Visualizador de convolución</h1>
    <p>Configura entrada, kernel, padding y pooling para recorrer visualmente cómo se forma cada activación.</p>

    <section class="card">
      <h2>Configuración</h2>
      <div id="controls">
        <div class="field">
          <label for="input_h">Tamaño de entrada</label>
          <div class="dimension-inputs">
            <input id="input_h" type="number" value="5" min="1" />
            <span class="dimension-separator">×</span>
            <input id="input_w" type="number" value="5" min="1" />
          </div>
        </div>
        <div class="field">
          <label for="kernel_h">Tamaño del kernel</label>
          <div class="dimension-inputs">
            <input id="kernel_h" type="number" value="3" min="1" />
            <span class="dimension-separator">×</span>
            <input id="kernel_w" type="number" value="3" min="1" />
          </div>
        </div>
        <div class="field">
          <label for="stride">Stride</label>
          <input id="stride" type="number" value="1" min="1" />
        </div>
        <div class="field">
          <label for="padding">Padding</label>
          <input id="padding" type="number" value="0" min="0" />
        </div>
        <div class="field">
          <label for="pad_type">Tipo de padding</label>
          <select id="pad_type">
            <option value="zero" selected>zero</option>
            <option value="edge">edge</option>
            <option value="reflect">reflect</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Pooling</h2>
      <div class="field">
        <label for="pool_type">Tipo de pooling</label>
        <select id="pool_type">
          <option value="max" selected>max-pooling</option>
          <option value="avg">avg-pooling</option>
        </select>
      </div>
      <div class="field">
        <label for="pool_size">Tamaño de ventana</label>
        <input id="pool_size" type="number" value="2" min="1" />
      </div>
    </section>

    <section class="card">
      <h2>Acciones</h2>
      <button id="play" class="primary" type="button">Generar visualización</button>
      <div class="footer-note" style="margin-top: 12px;">Los valores de entrada y del kernel se aleatorizan en cada ejecución para mostrar distintos recorridos.</div>
    </section>
  </aside>

  <main class="main">
    <div class="canvas-shell">
      <div id="vis"></div>
    </div>
  </main>
</div>
<script>
(function() {
    const CELL = 40;
    let inputArr, kernelArr, outputArr, paddedArr, padMask;
    let strideVal, padVal, padType;
    // pooling state
    let poolType, poolSize, poolArr, poolH, poolW;
    let filledOutputs;
    
    let positions, posIndex, kpos;
    let prevOverlaps = [];

    function randInt() {
        return Math.floor(Math.random() * 21) - 10;
    }

    function applyPadding(arr, pad, type) {
        const ih = arr.length;
        const iw = arr[0].length;
        const nh = ih + 2 * pad;
        const nw = iw + 2 * pad;
        const padded = Array.from({length: nh}, () => Array(nw).fill(0));
        for (let r = 0; r < nh; r++) {
            for (let c = 0; c < nw; c++) {
                const or = r - pad;
                const oc = c - pad;
                if (or < 0 || or >= ih || oc < 0 || oc >= iw) {
                    if (type === 'zero') {
                        padded[r][c] = 0;
                    } else if (type === 'edge') {
                        const rr = Math.min(Math.max(or, 0), ih - 1);
                        const cc = Math.min(Math.max(oc, 0), iw - 1);
                        padded[r][c] = arr[rr][cc];
                    } else if (type === 'reflect') {
                        let rr = or;
                        if (rr < 0) rr = -rr - 1;
                        if (rr >= ih) rr = 2 * ih - rr - 1;
                        let cc = oc;
                        if (cc < 0) cc = -cc - 1;
                        if (cc >= iw) cc = 2 * iw - cc - 1;
                        padded[r][c] = arr[rr][cc];
                    }
                } else {
                    padded[r][c] = arr[or][oc];
                }
            }
        }
        return padded;
    }

    function conv2d(padded, kernel) {
        const outH = Math.floor((padded.length - kernel.length) / strideVal) + 1;
        const outW = Math.floor((padded[0].length - kernel[0].length) / strideVal) + 1;
        if (outH <= 0 || outW <= 0) throw new Error('Kernel does not fit inside padded input with given stride.');
        const out = Array.from({length: outH}, () => Array(outW).fill(0));
        for (let i = 0; i < outH; i++) {
            for (let j = 0; j < outW; j++) {
                let sum = 0;
                for (let ki = 0; ki < kernel.length; ki++) {
                    for (let kj = 0; kj < kernel[0].length; kj++) {
                        const r = i * strideVal + ki;
                        const c = j * strideVal + kj;
                        sum += padded[r][c] * kernel[ki][kj];
                    }
                }
                out[i][j] = sum;
            }
        }
        return out;
    }
    
    function applyPooling(arr, size, type) {
        const h = arr.length;
        const w = arr[0].length;
        const ph = Math.floor(h / size);
        const pw = Math.floor(w / size);
        const pooled = Array.from({length: ph}, () => Array(pw).fill(0));
        for (let i = 0; i < ph; i++) {
            for (let j = 0; j < pw; j++) {
                let vals = [];
                for (let di = 0; di < size; di++) {
                    for (let dj = 0; dj < size; dj++) {
                        vals.push(arr[i*size + di][j*size + dj]);
                    }
                }
                if (type === 'max') {
                    pooled[i][j] = Math.max(...vals);
                } else {
                    const sum = vals.reduce((a,b)=>a+b,0);
                    pooled[i][j] = Math.round(sum / vals.length);
                }
            }
        }
        return pooled;
    }

    function buildGrid(arr, container, cellClass, mask) {
        container.style.width = arr[0].length * CELL + 'px';
        container.style.height = arr.length * CELL + 'px';
        container.innerHTML = '';
        container.style.display = 'grid';
        container.style.gridTemplateColumns = `repeat(${arr[0].length}, ${CELL}px)`;
        container.style.gridTemplateRows = `repeat(${arr.length}, ${CELL}px)`;
        for (let r = 0; r < arr.length; r++) {
            for (let c = 0; c < arr[0].length; c++) {
                const div = document.createElement('div');
                div.className = 'cell ' + cellClass;
                if (mask && mask[r][c]) div.className += ' pad-cell';
                div.id = `${container.id}-${r}-${c}`;
                div.textContent = arr[r][c];
                container.appendChild(div);
            }
        }
    }

    function makeLabeledWrapper(title, labelClass) {
        const wrapper = document.createElement('div');
        wrapper.className = 'grid-wrapper';
        const label = document.createElement('div');
        label.className = `grid-label ${labelClass}`;
        label.textContent = title;
        wrapper.appendChild(label);
        return wrapper;
    }

    function startAnimation() {
        const ih = parseInt(document.getElementById('input_h').value, 10);
        const iw = parseInt(document.getElementById('input_w').value, 10);
        const kh = parseInt(document.getElementById('kernel_h').value, 10);
        const kw = parseInt(document.getElementById('kernel_w').value, 10);
        strideVal = parseInt(document.getElementById('stride').value, 10);
        padVal = parseInt(document.getElementById('padding').value, 10);
        padType = document.getElementById('pad_type').value;
        try {
            if (ih <= 0 || iw <= 0 || kh <= 0 || kw <= 0 || strideVal <= 0 || padVal < 0) {
                throw new Error('Sizes must be positive and padding >=0.');
            }
            const inp = Array.from({length: ih}, () => Array(iw).fill(0).map(randInt));
            const ker = Array.from({length: kh}, () => Array(kw).fill(0).map(randInt));
            paddedArr = applyPadding(inp, padVal, padType);
            inputArr = paddedArr; // alias for display
            kernelArr = ker;
            outputArr = conv2d(paddedArr, ker);
        } catch (e) {
            alert(e.message);
            return;
        }
        const ihp = paddedArr.length;
        const iwp = paddedArr[0].length;
        const outH = outputArr.length;
        const outW = outputArr[0].length;
        // compute pad mask
        padMask = Array.from({length: ihp}, () => Array(iwp).fill(false));
        if (padVal > 0) {
            for (let r = 0; r < ihp; r++) {
                for (let c = 0; c < iwp; c++) {
                    if (r < padVal || r >= ihp - padVal || c < padVal || c >= iwp - padVal) {
                        padMask[r][c] = true;
                    }
                }
            }
        }

        const vis = document.getElementById('vis');
        vis.innerHTML = '';
        // create wrapper for grids so nav can sit below
        const grids = document.createElement('div');
        grids.id = 'grids';
        vis.appendChild(grids);

        // kernel grid (left)
        const kernelWrapper = makeLabeledWrapper('Kernel', 'label-kernel');
        const kernelContainer = document.createElement('div');
        kernelContainer.id = 'kernel-grid';
        kernelWrapper.appendChild(kernelContainer);
        grids.appendChild(kernelWrapper);
        buildGrid(kernelArr, kernelContainer, 'kernel-cell');

        // input grid container
        const inputWrapper = makeLabeledWrapper('Entrada', 'label-input');
        const inContainer = document.createElement('div');
        inContainer.id = 'input-grid';
        inContainer.style.position = 'relative';
        inputWrapper.appendChild(inContainer);
        grids.appendChild(inputWrapper);
        buildGrid(paddedArr, inContainer, 'input-cell', padMask);
        // overlay element
        const overlay = document.createElement('div');
        overlay.id = 'kernel-overlay';
        inContainer.appendChild(overlay);

        // output grid
        const outputWrapper = makeLabeledWrapper('Campo receptivo', 'label-output');
        const outContainer = document.createElement('div');
        outContainer.id = 'output-grid';
        outputWrapper.appendChild(outContainer);
        grids.appendChild(outputWrapper);
        buildGrid(outputArr.map(r=>r.map(_=>'')), outContainer, 'output-cell');
        // pooling setup
        poolType = document.getElementById('pool_type').value;
        poolSize = parseInt(document.getElementById('pool_size').value, 10);
        const outH2 = outputArr.length;
        const outW2 = outputArr[0].length;
        poolH = Math.floor(outH2 / poolSize);
        poolW = Math.floor(outW2 / poolSize);
        filledOutputs = Array.from({length: outH2}, () => Array(outW2).fill(0));
        poolArr = Array.from({length: poolH}, () => Array(poolW).fill(''));
        if (poolSize > 0) {
            const poolWrapper = makeLabeledWrapper('Pooling', 'label-pool');
            const poolContainer = document.createElement('div');
            poolContainer.id = 'pool-grid';
            poolWrapper.appendChild(poolContainer);
            grids.appendChild(poolWrapper);
            buildGrid(poolArr, poolContainer, 'pool-cell');
        }

        // navigation controls
        const nav = document.createElement('div');
        nav.className = 'nav-buttons';
        const prevBtn = document.createElement('button'); prevBtn.textContent = 'Previous';
        const nextBtn = document.createElement('button'); nextBtn.textContent = 'Next';
        const randBtn = document.createElement('button'); randBtn.textContent = 'Randomize';
        // apply classes for 3D look and sizing
        prevBtn.className = 'ghost';
        nextBtn.className = 'secondary';
        randBtn.className = 'primary';
        prevBtn.onclick = prevPos;
        nextBtn.onclick = nextPos;
        randBtn.onclick = startAnimation;
        // first row: previous and next
        const row1 = document.createElement('div');
        row1.appendChild(prevBtn);
        row1.appendChild(nextBtn);
        // second row: randomize
        row1.className = 'button-row';
        const row2 = document.createElement('div');
        row2.className = 'button-row single';
        row2.appendChild(randBtn);
        nav.appendChild(row1);
        nav.appendChild(row2);
        vis.appendChild(nav);

        // prepare position list
        positions = [];
        for (let i = 0; i < outH; i++) {
            for (let j = 0; j < outW; j++) {
                positions.push([i, j]);
            }
        }
        posIndex = 0;
        kpos = positions[0].slice();
        prevOverlaps = [];
        updateDisplay();
    }

    function prevPos() {
        if (posIndex > 0) {
            const [oldi, oldj] = positions[posIndex];
            // clear output cell
            const oc = document.getElementById(`output-grid-${oldi}-${oldj}`);
            oc.textContent = '';
            oc.className = 'cell output-cell';
            // update filledOutputs and potentially clear pool
            filledOutputs[oldi][oldj] = 0;
            if (poolSize > 0) {
                const pi = Math.floor(oldi / poolSize);
                const pj = Math.floor(oldj / poolSize);
                if (pi < poolH && pj < poolW) {
                    // if any cell in block unfilled, clear pool cell
                    let complete = true;
                    for (let di = 0; di < poolSize && complete; di++) {
                        for (let dj = 0; dj < poolSize; dj++) {
                            const rr = pi * poolSize + di;
                            const cc = pj * poolSize + dj;
                            if (filledOutputs[rr][cc] === 0) {
                                complete = false;
                                break;
                            }
                        }
                    }
                    if (!complete) {
                        poolArr[pi][pj] = '';
                        const pc = document.getElementById(`pool-grid-${pi}-${pj}`);
                        if (pc) {
                            pc.textContent = '';
                            pc.className = 'cell pool-cell';
                        }
                    }
                }
            }
            posIndex--;
            kpos = positions[posIndex].slice();
            updateDisplay();
        }
    }

    function nextPos() {
        if (posIndex < positions.length - 1) {
            posIndex++;
            kpos = positions[posIndex].slice();
            updateDisplay();
        }
    }

    function updateDisplay() {
        // restore previous overlaps
        for (const item of prevOverlaps) {
            const cell = document.getElementById(`input-grid-${item.r}-${item.c}`);
            cell.innerHTML = item.origText;
            cell.className = item.origClass;
        }
        prevOverlaps = [];
        const [i_pos, j_pos] = kpos;
        const base_r = i_pos * strideVal;
        const base_c = j_pos * strideVal;
        // highlight overlapping cells
        for (let kr = 0; kr < kernelArr.length; kr++) {
            for (let kc = 0; kc < kernelArr[0].length; kc++) {
                const r = base_r + kr;
                const c = base_c + kc;
                if (r >= 0 && r < inputArr.length && c >= 0 && c < inputArr[0].length) {
                    const cell = document.getElementById(`input-grid-${r}-${c}`);
                    prevOverlaps.push({ r, c, origText: cell.innerHTML, origClass: cell.className });
                    cell.className = 'cell overlap-cell';
                    const inp = inputArr[r][c];
                    const ker = kernelArr[kr][kc];
                    cell.innerHTML = `<span class="inp">${inp}</span><span>×</span><span class="ker">${ker}</span>`;
                }
            }
        }
        // move overlay
        const overlay = document.getElementById('kernel-overlay');
        overlay.style.left = base_c * CELL + 'px';
        overlay.style.top = base_r * CELL + 'px';
        overlay.style.width = kernelArr[0].length * CELL + 'px';
        overlay.style.height = kernelArr.length * CELL + 'px';
        
        // update output cell
        const [oi, oj] = [i_pos, j_pos];
        const oc = document.getElementById(`output-grid-${oi}-${oj}`);
        oc.textContent = outputArr[oi][oj];
        oc.className = 'cell output-cell';
        // mark filled and possibly update pooling
        filledOutputs[oi][oj] = 1;
        if (poolSize > 0) {
            const pi = Math.floor(oi / poolSize);
            const pj = Math.floor(oj / poolSize);
            if (pi < poolH && pj < poolW) {
                let complete = true;
                for (let di = 0; di < poolSize && complete; di++) {
                    for (let dj = 0; dj < poolSize; dj++) {
                        const rr = pi * poolSize + di;
                        const cc = pj * poolSize + dj;
                        if (filledOutputs[rr][cc] === 0) {
                            complete = false;
                            break;
                        }
                    }
                }
                if (complete) {
                    // compute pool value
                    let vals = [];
                    for (let di = 0; di < poolSize; di++) {
                        for (let dj = 0; dj < poolSize; dj++) {
                            vals.push(outputArr[pi*poolSize + di][pj*poolSize + dj]);
                        }
                    }
                    let pv;
                    if (poolType === 'max') {
                        pv = Math.max(...vals);
                    } else {
                        const sum = vals.reduce((a,b)=>a+b,0);
                        pv = Math.round(sum / vals.length);
                    }
                    poolArr[pi][pj] = pv;
                    const pc = document.getElementById(`pool-grid-${pi}-${pj}`);
                    if (pc) {
                        pc.textContent = pv;
                        pc.className = 'cell pool-cell';
                    }
                }
            }
        }
    }

    document.getElementById('play').onclick = startAnimation;
})();
</script>
</body>
</html>
